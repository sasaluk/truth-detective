<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Detective - Host Screen</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #313244; padding: 25px; border-radius: 12px; }
        h1 { text-align: center; color: #f5e0dc; }
        .game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .question-box { background: #181825; padding: 20px; border-radius: 8px; border-left: 5px solid #89b4fa; }
        .statement { background: #313244; margin: 10px 0; padding: 12px; border-radius: 6px; }
        .timer-box { text-align: center; background: #45475a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .timer { font-size: 2.5em; font-weight: bold; color: #f38ba8; }
        .scoreboard { background: #181825; padding: 15px; border-radius: 8px; }
        .score-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #313244; }
        .ans-card { background: #45475a; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.btn-success { background: #a6e3a1; }
        button.btn-warning { background: #f9e2af; }
        button.btn-danger { background: #f38ba8; }
        .truth-text { color: #a6e3a1; font-weight: bold; }
        .lie-text { color: #f38ba8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ Truth Detective - Host Dashboard</h1>
    
    <div class="game-layout">
        <div>
            <div class="question-box">
                <h3 id="topicTitle" style="color:#f9e2af; margin-top:0;">โจทย์ที่ 1/20</h3>
                <div id="statementsContainer"></div>

                <!-- คำตอบจากผู้เล่นเรียลไทม์ -->
                <div style="background:#313244; padding:15px; border-radius:8px; margin-top:15px;">
                    <h4 style="margin:0 0 10px 0; color:#f9e2af;">📥 คำตอบที่ส่งมาจากมือถือผู้เล่น (เรียลไทม์)</h4>
                    <div id="submittedAnswers"></div>
                </div>
            </div>

            <div id="answerBox" style="display:none; background:#2a2b3d; padding:15px; border-radius:8px; margin-top:15px; border:1px dashed #f9e2af;">
                <h4 style="margin:0 0 10px 0; color:#f9e2af;">🔍 เฉลยสำหรับ Host:</h4>
                <div id="answerDetail"></div>
                <div id="answerText"></div>
            </div>
        </div>

        <div>
            <div class="timer-box">
                <div>⏱️ เวลาส่งคำตอบ</div>
                <div class="timer" id="timer">60</div>
                <button onclick="startTimer()" style="width:100%; margin-top:5px;">▶️ เริ่มจับเวลา 60s</button>
            </div>

            <div class="scoreboard">
                <h3 style="margin-top:0; color:#f9e2af; text-align:center;">🏆 คะแนนรวม</h3>
                <div id="scoreboardList"></div>
            </div>
        </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
        <button class="btn-warning" onclick="toggleAnswer()">👁️ ดูเฉลย</button>
        <button class="btn-danger" onclick="nextQuestion()">⏭️ ข้อถัดไป</button>
        <button class="btn-danger" style="background:#ef5777;" onclick="resetAllData()">🔄 รีเซ็ตเกมใหม่ทั้งหมด</button>
    </div>
</div>

<script>
    // Firebase Config ของ Boss LJ
    const firebaseConfig = {
      apiKey: "AIzaSyC_tz6NfILT1SGw1VE3v9f1vGVL0Dy_hlk",
      authDomain: "truth-detective.firebaseapp.com",
      projectId: "truth-detective",
      storageBucket: "truth-detective.firebasestorage.app",
      messagingSenderId: "1044458468231",
      appId: "1:1044458468231:web:95b4eb244b787e0a919922",
      measurementId: "G-441B8HHGDD"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const characters = [
        { title: "คาแรกเตอร์ที่ 1", target: "โดราเอมอน", lieReason: "ไม่มีหูเพราะโดนหนูแทะ ไม่ใช่หูยาวเหมือนกระต่าย", s: [
            {t: "ฉันมาจากโลกอนาคตในศตวรรษที่ 22", isLie: false},
            {t: "ฉันชอบกินขนมโดรายากิมากที่สุด", isLie: false},
            {t: "ฉันมีหูยาวเหมือนกระต่ายและกลัวหนูมาก", isLie: true}
        ]},
        { title: "คาแรกเตอร์ที่ 2", target: "กาต้มน้ำ", lieReason: "กาต้มน้ำใช้ทำน้ำร้อน ไม่ใช่เก็บความเย็น", s: [
            {t: "ฉันตั้งอยู่บนเตาเพื่อทำให้น้ำร้อน", isLie: false},
            {t: "เมื่อน้ำเดือด ฉันจะส่งเสียงหวีดร้องออกมา", isLie: false},
            {t: "ฉันเก็บความเย็นให้ไอศกรีมได้ตลอดวัน", isLie: true}
        ]},
        { title: "คาแรกเตอร์ที่ 3", target: "สไปเดอร์แมน (Spider-Man)", lieReason: "เศรษฐีพันล้านชุดเกราะคือ ไอรอนแมน สไปเดอร์แมนเป็นเด็กวัยรุ่นถังแตก", s: [
            {t: "ฉันได้พลังมาจากแมงมุมอาบกรรมรังสี", isLie: false},
            {t: "ฉันเป็นมหาเศรษฐีพันล้านที่ชอบใส่ชุดเกราะเหล็ก", isLie: true},
            {t: "ฉันสามารถโหนใยไปมาตามตึกสูงได้", isLie: false}
        ]},
        { title: "คาแรกเตอร์ที่ 4", target: "ไดโนเสาร์ (T-Rex)", lieReason: "แขนของ T-Rex สั้นมาก เอื้อมไม่ถึงหลัง", s: [
            {t: "ฉันเป็นนักล่าเนื้อขนาดใหญ่ในยุคดึกดำบรรพ์", isLie: false},
            {t: "ฉันมีแขนสองข้างที่ยาวมากจนเอื้อมเกาหลังตัวเองได้", isLie: true},
            {t: "ฟันของฉันคมเหมือนมีดซุย", isLie: false}
        ]},
        { title: "คาแรกเตอร์ที่ 5", target: "ซินเดอเรลล่า", lieReason: "รถม้าเสกมาจากฟักทอง ไม่ใช่แตงโม", s: [
            {t: "ฉันทำรองเท้าแก้วตกไว้ขณะรีบวิ่งออกจากงานเต้นรำ", isLie: false},
            {t: "รถม้าของฉันทำมาจากผลแตงโมยักษ์", isLie: true},
            {t: "เวทมนตร์ของนางฟ้าแม่ทูนหัวจะหมดฤทธิ์ตอนเที่ยงคืน", isLie: false}
        ]}
    ];

    let currentIndex = 0;
    let timerInterval = null;

    db.ref('players').on('value', snapshot => {
        const data = snapshot.val() || {};
        const list = document.getElementById('scoreboardList');
        const sorted = Object.keys(data).map(k => ({name: k, score: data[k].score})).sort((a,b) => b.score - a.score);
        list.innerHTML = sorted.map(p => `
            <div class="score-item">
                <span>👤 ${p.name}</span>
                <span style="color:#f9e2af; font-weight:bold;">${p.score} คะแนน</span>
            </div>
        `).join('');
    });

    db.ref('answers').on('value', snapshot => {
        const data = snapshot.val() || {};
        const list = document.getElementById('submittedAnswers');
        const keys = Object.keys(data);
        if (keys.length === 0) {
            list.innerHTML = `<span style="color:#585b70;">ยังไม่มีผู้เล่นส่งคำตอบมา...</span>`;
            return;
        }
        list.innerHTML = keys.map(pName => `
            <div class="ans-card">
                <div><strong>${pName}:</strong> ${data[pName].text}</div>
                <button class="${data[pName].scored ? 'btn-success' : ''}" onclick="addScore('${pName}')" ${data[pName].scored ? 'disabled' : ''}>
                    ${data[pName].scored ? '✓ ได้คะแนนแล้ว' : 'ถูกต้อง (+1)'}
                </button>
            </div>
        `).join('');
    });

    function loadQuestion(index) {
        const q = characters[index];
        document.getElementById('topicTitle').innerText = `โจทย์ที่ ${index + 1}/${characters.length}: ${q.title}`;
        const container = document.getElementById('statementsContainer');
        container.innerHTML = '';
        let answerDetailHTML = '';

        q.s.forEach((item, i) => {
            container.innerHTML += `<div class="statement"><strong>ข้อ ${i+1}:</strong> ${item.t}</div>`;
            answerDetailHTML += `<div><strong>ข้อ ${i+1}:</strong> ${item.t} -> <span class="${item.isLie ? 'lie-text' : 'truth-text'}">${item.isLie ? '[คำโกหก]' : '[ความจริง]'}</span></div>`;
        });

        document.getElementById('answerDetail').innerHTML = answerDetailHTML;
        document.getElementById('answerText').innerHTML = `<hr style="border:0; border-top:1px solid #585b70; margin:8px 0;"><strong>เฉลย:</strong> ${q.target}<br><strong>เหตุผล:</strong> ${q.lieReason}`;
        document.getElementById('answerBox').style.display = 'none';

        db.ref('answers').remove();
        resetTimer();
    }

    function addScore(playerName) {
        db.ref(`players/${playerName}/score`).transaction(score => (score || 0) + 1);
        db.ref(`answers/${playerName}/scored`).set(true);
    }

    function startTimer() {
        let timeLeft = 60;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("หมดเวลาส่งคำตอบ 60 วินาที!");
            }
        }, 1000);
    }

    function resetTimer() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('timer').innerText = "60";
    }

    function toggleAnswer() {
        const box = document.getElementById('answerBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function nextQuestion() {
        if (currentIndex < characters.length - 1) {
            currentIndex++;
            loadQuestion(currentIndex);
        } else {
            alert("จบเกมแล้วครับ!");
        }
    }

    function resetAllData() {
        if (confirm("ต้องการรีเซ็ตคะแนนและผู้เล่นทั้งหมดใช่ไหมครับ?")) {
            db.ref().remove();
            location.reload();
        }
    }

    loadQuestion(0);
</script>
</body>
</html>
