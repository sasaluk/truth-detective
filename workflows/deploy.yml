name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # หรือ master ตามชื่อ branch หลักของคุณ Boss LJ

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ดึงค่า Secret ไปเขียนทับ __API_KEY__ ในไฟล์ HTML
      - name: Inject API Key
        run: |
          sed -i 's/__API_KEY__/${{ secrets.FIREBASE_API_KEY }}/g' player.html

      # อัปโหลดไฟล์ขึ้น GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # โฟลเดอร์ที่เก็บไฟล์ HTML

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
