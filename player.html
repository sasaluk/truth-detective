<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Detective - Player</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; margin: 0; }
        .card { background: #313244; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-size: 1em; box-sizing: border-box; }
        input { background: #181825; color: white; border: 1px solid #45475a; }
        button { background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
        .status { text-align: center; color: #a6e3a1; margin-top: 10px; }
        .q-badge { background: #f9e2af; color: #11111b; padding: 4px 8px; border-radius: 6px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card" id="loginBox">
    <h2>🕵️‍♂️ Join Game</h2>
    <input type="text" id="playerName" placeholder="Enter your name...">
    <button onclick="joinGame()">Enter Game</button>
</div>

<div class="card" id="gameBox" style="display:none;">
    <div class="q-badge" id="questionBadge">Current: Question 1</div>
    <h3 id="welcomeText" style="margin-top:0; color:#f9e2af;"></h3>
    <label>Guess the Character:</label>
    <input type="text" id="answerInput" placeholder="Type character name (e.g., Doraemon)">
    <button onclick="sendAnswer()">🚀 Submit Answer</button>
    <div id="statusMsg" class="status"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_tz6NfILT1SGw1VE3v9f1vGVL0Dy_hlk",
      authDomain: "truth-detective.firebaseapp.com",
      databaseURL: "https://truth-detective-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "truth-detective",
      storageBucket: "truth-detective.firebasestorage.app",
      messagingSenderId: "1044458468231",
      appId: "1:1044458468231:web:95b4eb244b787e0a919922",
      measurementId: "G-441B8HHGDD"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "";
    let currentQuestionNo = 1;

    db.ref('currentGame/questionNo').on('value', snapshot => {
        if (snapshot.exists()) {
            currentQuestionNo = snapshot.val();
            document.getElementById('questionBadge').innerText = `Current: Question ${currentQuestionNo}`;
        }
    });

    function joinGame() {
        const name = document.getElementById('playerName').value.trim();
        if (!name) return alert("Please enter your name!");
        myName = name;

        // บันทึกชื่อเข้า Firebase พร้อมดัก Error
        db.ref(`players/${myName}`).set({ score: 0 })
            .then(() => {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('gameBox').style.display = 'block';
                document.getElementById('welcomeText').innerText = `👤 Player: ${myName}`;
            })
            .catch(error => {
                alert("Firebase Error: " + error.message);
                console.error("Join Game Error:", error);
            });
    }

    function sendAnswer() {
        const text = document.getElementById('answerInput').value.trim();
        if (!text) return alert("Please type an answer before submitting!");

        db.ref(`answers/${myName}`).set({
            text: text,
            questionNo: currentQuestionNo,
            scored: false
        }).then(() => {
            document.getElementById('statusMsg').innerText = `✅ Submitted for Question ${currentQuestionNo}!`;
            document.getElementById('answerInput').value = "";
            setTimeout(() => { document.getElementById('statusMsg').innerText = ""; }, 3000);
        }).catch(error => {
            alert("Submit Error: " + error.message);
        });
    }
</script>
</body>
</html>
