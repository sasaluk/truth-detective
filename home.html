<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Detective - Host Screen</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #313244; padding: 25px; border-radius: 12px; }
        h1 { text-align: center; color: #f5e0dc; }
        .game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .question-box { background: #181825; padding: 20px; border-radius: 8px; border-left: 5px solid #89b4fa; }
        .statement { background: #313244; margin: 10px 0; padding: 12px; border-radius: 6px; }
        .timer-box { text-align: center; background: #45475a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .timer { font-size: 2.5em; font-weight: bold; color: #f38ba8; }
        .scoreboard { background: #181825; padding: 15px; border-radius: 8px; }
        .score-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #313244; }
        .ans-card { background: #45475a; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.btn-success { background: #a6e3a1; }
        button.btn-warning { background: #f9e2af; }
        button.btn-danger { background: #f38ba8; }
        .truth-text { color: #a6e3a1; font-weight: bold; }
        .lie-text { color: #f38ba8; font-weight: bold; }
        .q-tag { background: #f9e2af; color: #11111b; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ Truth Detective - Host Dashboard</h1>
    
    <div class="game-layout">
        <div>
            <div class="question-box">
                <h3 id="topicTitle" style="color:#f9e2af; margin-top:0;">Question 1/5</h3>
                <div id="statementsContainer"></div>

                <div style="background:#313244; padding:15px; border-radius:8px; margin-top:15px;">
                    <h4 style="margin:0 0 10px 0; color:#f9e2af;">📥 Live Answers from Players</h4>
                    <div id="submittedAnswers"></div>
                </div>
            </div>

            <div id="answerBox" style="display:none; background:#2a2b3d; padding:15px; border-radius:8px; margin-top:15px; border:1px dashed #f9e2af;">
                <h4 style="margin:0 0 10px 0; color:#f9e2af;">🔍 Host Answer Key:</h4>
                <div id="answerDetail"></div>
                <div id="answerText"></div>
            </div>
        </div>

        <div>
            <div class="timer-box">
                <div>⏱️ Time Remaining</div>
                <div class="timer" id="timer">60</div>
                <button onclick="startTimer()" style="width:100%; margin-top:5px;">▶️ Start Timer (60s)</button>
            </div>

            <div class="scoreboard">
                <h3 style="margin-top:0; color:#f9e2af; text-align:center;">🏆 Leaderboard (<span id="playerCount">0</span>)</h3>
                <div id="scoreboardList"></div>
            </div>
        </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
        <button class="btn-warning" onclick="toggleAnswer()">👁️ Show Answer Key</button>
        <button class="btn-danger" onclick="nextQuestion()">⏭️ Next Question</button>
        <button class="btn-danger" style="background:#ef5777;" onclick="resetAllData()">🔄 Reset Game</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_tz6NfILT1SGw1VE3v9f1vGVL0Dy_hlk",
      authDomain: "truth-detective.firebaseapp.com",
      projectId: "truth-detective",
      storageBucket: "truth-detective.firebasestorage.app",
      messagingSenderId: "1044458468231",
      appId: "1:1044458468231:web:95b4eb244b787e0a919922",
      measurementId: "G-441B8HHGDD"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const characters = [
        { title: "Character #1", target: "Doraemon", lieReason: "Doraemon has no ears because they were eaten by a mouse, not long rabbit ears.", s: [
            {t: "I came from the future in the 22nd century.", isLie: false},
            {t: "My absolute favorite food is Dorayaki.", isLie: false},
            {t: "I have long rabbit ears and I am terrified of mice.", isLie: true}
        ]},
        { title: "Character #2", target: "Kettle", lieReason: "A kettle is used to heat water, not to keep ice cream cold.", s: [
            {t: "I sit on a stove to heat up water.", isLie: false},
            {t: "When water boils, I make a loud whistling sound.", isLie: false},
            {t: "I am used to keep ice cream frozen all day.", isLie: true}
        ]},
        { title: "Character #3", target: "Spider-Man", lieReason: "Iron Man wears iron armor; Spider-Man shoots webs and wears a suit.", s: [
            {t: "I gained my superpowers from a radioactive spider bite.", isLie: false},
            {t: "I am a billionaire superhero who wears iron armor.", isLie: true},
            {t: "I can swing between skyscrapers using webs.", isLie: false}
        ]},
        { title: "Character #4", target: "T-Rex", lieReason: "T-Rex has extremely short arms and cannot reach its own back.", s: [
            {t: "I am a massive carnivore from prehistoric times.", isLie: false},
            {t: "I have long arms that easily reach to scratch my back.", isLie: true},
            {t: "I have sharp teeth like large hunting knives.", isLie: false}
        ]},
        { title: "Character #5", target: "Cinderella", lieReason: "The carriage was transformed from a pumpkin, not a watermelon.", s: [
            {t: "I accidentally left a glass slipper behind at the royal ball.", isLie: false},
            {t: "My magical carriage was transformed from a giant watermelon.", isLie: true},
            {t: "Fairy Godmother's magic ends precisely at midnight.", isLie: false}
        ]},
        { title: "Character #6", target: "Pikachu", lieReason: "Pikachu shoots electricity from its red cheeks, not water.", s: [
            {t: "I am a yellow electric mouse Pokémon.", isLie: false},
            {t: "I can shoot high-pressure jets of water from my tail.", isLie: true},
            {t: "My trainer's name is Ash Ketchum.", isLie: false}
        ]},
        { title: "Character #7", target: "Batman", lieReason: "Batman has no superpowers; he relies on wealth, tech, and training.", s: [
            {t: "My real name is Bruce Wayne, living in Gotham City.", isLie: false},
            {t: "I can fly naturally and shoot laser beams from my eyes.", isLie: true},
            {t: "My base of operations is called the Batcave.", isLie: false}
        ]},
        { title: "Character #8", target: "SpongeBob SquarePants", lieReason: "SpongeBob lives in a pineapple under the sea, not an apple tree.", s: [
            {t: "I work as a fry cook at the Krusty Krab.", isLie: false},
            {t: "I live in a high wooden treehouse on an apple tree.", isLie: true},
            {t: "My best friend is a pink starfish named Patrick.", isLie: false}
        ]},
        { title: "Character #9", target: "Elsa", lieReason: "Elsa controls ice and snow, not fire and lava.", s: [
            {t: "I am the Queen of Arendelle with magic powers.", isLie: false},
            {t: "I can shoot flames and erupt lava from my hands.", isLie: true},
            {t: "I built a giant ice palace on the North Mountain.", isLie: false}
        ]},
        { title: "Character #10", target: "Mario", lieReason: "Mario is a Italian plumber, not a doctor of space engineering.", s: [
            {t: "I wear blue overalls, a red cap, and have a thick mustache.", isLie: false},
            {t: "I regularly eat mushrooms to grow bigger.", isLie: false},
            {t: "I am a professional rocket scientist working for NASA.", isLie: true}
        ]},
        { title: "Character #11", target: "Snow White", lieReason: "Snow White ate a poisoned apple, not a banana.", s: [
            {t: "I lived with seven dwarves in a cozy forest cabin.", isLie: false},
            {t: "I fell into a deep sleep after eating a poisoned banana.", isLie: true},
            {t: "An evil queen tried to harm me because of her Magic Mirror.", isLie: false}
        ]},
        { title: "Character #12", target: "Harry Potter", lieReason: "Harry Potter's scar is lightning-shaped, not star-shaped.", s: [
            {t: "I attended Hogwarts School of Witchcraft and Wizardry.", isLie: false},
            {t: "I have a bright star-shaped scar on my forehead.", isLie: true},
            {t: "My pet owl is named Hedwig.", isLie: false}
        ]},
        { title: "Character #13", target: "Sonic the Hedgehog", lieReason: "Sonic is famous for extreme speed, not being super slow.", s: [
            {t: "I am a blue hedgehog who loves collecting gold rings.", isLie: false},
            {t: "I move extremely slowly like a turtle on land.", isLie: true},
            {t: "My arch-enemy is Doctor Eggman.", isLie: false}
        ]},
        { title: "Character #14", target: "Shrek", lieReason: "Shrek is a green ogre who lives in a swamp, not a gold palace.", s: [
            {t: "I am a big green ogre who values my privacy.", isLie: false},
            {t: "I live in a golden palace in the middle of a desert.", isLie: true},
            {t: "My chattiest companion is a talking Donkey.", isLie: false}
        ]},
        { title: "Character #15", target: "Garfield", lieReason: "Garfield loves lasagna and hates Mondays and exercise.", s: [
            {t: "I am a lazy orange tabby cat who loves lasagna.", isLie: false},
            {t: "I love waking up early on Monday mornings to exercise.", isLie: true},
            {t: "My dog friend in the house is named Odie.", isLie: false}
        ]},
        { title: "Character #16", target: "Pinocchio", lieReason: "Pinocchio's nose grows long when he tells a lie, not when he tells the truth.", s: [
            {t: "I am a wooden puppet brought to life by magic.", isLie: false},
            {t: "My nose shrinks tiny whenever I tell a lie.", isLie: true},
            {t: "My creator and father is a woodcarver named Geppetto.", isLie: false}
        ]},
        { title: "Character #17", target: "Thor", lieReason: "Thor wields a hammer named Mjolnir, not a wooden bow.", s: [
            {t: "I am the Asgardian God of Thunder.", isLie: false},
            {t: "My main battle weapon is a wooden bow and arrow.", isLie: true},
            {t: "My adopted brother is the God of Mischief, Loki.", isLie: false}
        ]},
        { title: "Character #18", target: "Minion", lieReason: "Minions love bananas, speak Minionese, and wear denim overalls.", s: [
            {t: "I am a small yellow creature with one or two eyes.", isLie: false},
            {t: "I wear blue denim overalls and love eating bananas.", isLie: false},
            {t: "I speak fluent French and work as a lawyer in Paris.", isLie: true}
        ]},
        { title: "Character #19", target: "Tarzan", lieReason: "Tarzan was raised by apes in the jungle, not in an underwater city.", s: [
            {t: "I was raised by gorillas deep inside the jungle.", isLie: false},
            {t: "I lived my entire childhood in a sunken underwater city.", isLie: true},
            {t: "I swing from vine to vine across the rainforest.", isLie: false}
        ]},
        { title: "Character #20", target: "Aladdin", lieReason: "Aladdin found a magical Genie inside a lamp, not a wooden chest.", s: [
            {t: "I found a magical lamp containing a wish-granting Genie.", isLie: false},
            {t: "I fly around Agrabah on a magical flying carpet.", isLie: false},
            {t: "I unlocked a magic treasure chest containing a giant dragon.", isLie: true}
        ]}
    ];

    let currentIndex = 0;
    let timerInterval = null;

    // ดึงผู้เล่นทุกคนจาก Firebase ขึ้นแสดงใน Leaderboard แบบเรียลไทม์
    db.ref('players').on('value', snapshot => {
        const data = snapshot.val() || {};
        const list = document.getElementById('scoreboardList');
        const keys = Object.keys(data);
        
        document.getElementById('playerCount').innerText = keys.length;

        if (keys.length === 0) {
            list.innerHTML = `<div style="color:#585b70; text-align:center; padding:10px;">Waiting for players to join...</div>`;
            return;
        }

        const sorted = keys.map(k => ({name: k, score: data[k].score || 0})).sort((a,b) => b.score - a.score);
        list.innerHTML = sorted.map(p => `
            <div class="score-item">
                <span>👤 ${p.name}</span>
                <span style="color:#f9e2af; font-weight:bold;">${p.score} pts</span>
            </div>
        `).join('');
    });

    // ดึงคำตอบเฉพาะที่มีการส่งมาในแต่ละข้อ
    db.ref('answers').on('value', snapshot => {
        const data = snapshot.val() || {};
        const list = document.getElementById('submittedAnswers');
        const keys = Object.keys(data);
        if (keys.length === 0) {
            list.innerHTML = `<span style="color:#585b70;">Waiting for player responses...</span>`;
            return;
        }
        list.innerHTML = keys.map(pName => `
            <div class="ans-card">
                <div>
                    <strong>${pName}:</strong> 
                    <span class="q-tag">Q${data[pName].questionNo || '?'}</span>
                    ${data[pName].text}
                </div>
                <button class="${data[pName].scored ? 'btn-success' : ''}" onclick="addScore('${pName}')" ${data[pName].scored ? 'disabled' : ''}>
                    ${data[pName].scored ? '✓ Awarded' : 'Correct (+1)'}
                </button>
            </div>
        `).join('');
    });

    function loadQuestion(index) {
        const q = characters[index];
        document.getElementById('topicTitle').innerText = `Question ${index + 1}/${characters.length}: ${q.title}`;
        const container = document.getElementById('statementsContainer');
        container.innerHTML = '';
        let answerDetailHTML = '';

        q.s.forEach((item, i) => {
            container.innerHTML += `<div class="statement"><strong>Statement ${i+1}:</strong> ${item.t}</div>`;
            answerDetailHTML += `<div><strong>Statement ${i+1}:</strong> ${item.t} -> <span class="${item.isLie ? 'lie-text' : 'truth-text'}">${item.isLie ? '[LIE]' : '[TRUTH]'}</span></div>`;
        });

        document.getElementById('answerDetail').innerHTML = answerDetailHTML;
        document.getElementById('answerText').innerHTML = `<hr style="border:0; border-top:1px solid #585b70; margin:8px 0;"><strong>Character:</strong> ${q.target}<br><strong>Explanation:</strong> ${q.lieReason}`;
        document.getElementById('answerBox').style.display = 'none';

        db.ref('currentGame/questionNo').set(index + 1);
        db.ref('answers').remove();
        resetTimer();
    }

    function addScore(playerName) {
        db.ref(`players/${playerName}/score`).transaction(score => (score || 0) + 1);
        db.ref(`answers/${playerName}/scored`).set(true);
    }

    function startTimer() {
        let timeLeft = 60;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time is up!");
            }
        }, 1000);
    }

    function resetTimer() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('timer').innerText = "60";
    }

    function toggleAnswer() {
        const box = document.getElementById('answerBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function nextQuestion() {
        if (currentIndex < characters.length - 1) {
            currentIndex++;
            loadQuestion(currentIndex);
        } else {
            alert("Game Completed!");
        }
    }

    function resetAllData() {
        if (confirm("Reset all player scores and responses?")) {
            db.ref().remove();
            location.reload();
        }
    }

    loadQuestion(0);
</script>
</body>
</html>
